    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/kfgqpc-uthman-taha-naskh" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1A1A2E;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: #F7E7B4;
            font-size: 22px;
            margin-bottom: 12px;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls label {
            color: #ccc;
            font-size: 14px;
        }

        .controls input {
            width: 70px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #222;
            color: #eee;
            font-size: 14px;
            text-align: center;
        }

        .controls button {
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #1A4D2E, #27623C);
            color: #F7E7B4;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .controls button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26,77,46,0.4);
        }

        /* ===================== SPREAD CONTAINER (2 pages side by side) ===================== */
        .mushaf-spread {
            display: flex;
            gap: 0;
            justify-content: center;
            align-items: flex-start;
            max-width: 1320px;
            width: 100%;
        }

        /* Each page occupies half the spread */
        .mushaf-page-container {
            background: #FFFDF8 !important;
            border: 2px solid #C59B27 !important;
            border-radius: 0 !important;
            padding: 20px 24px !important;
            box-shadow: 0 12px 40px rgba(15, 45, 74, 0.16) !important;
            position: relative;
            flex: 1;
            max-width: 650px;
            min-width: 0;
        }

        /* Right page gets rounded left corners, left page gets rounded right corners */
        .mushaf-page-container.page-right {
            border-radius: 12px 0 0 12px !important;
            border-right: 1px solid #C59B27 !important;
        }

        .mushaf-page-container.page-left {
            border-radius: 0 12px 12px 0 !important;
            border-left: 1px solid #C59B27 !important;
        }

        /* Spine shadow in the center */
        .mushaf-page-container.page-right {
            box-shadow: 12px 0 20px -8px rgba(0,0,0,0.15) inset, 0 12px 40px rgba(15,45,74,0.16) !important;
        }

        .mushaf-page-container.page-left {
            box-shadow: -12px 0 20px -8px rgba(0,0,0,0.15) inset, 0 12px 40px rgba(15,45,74,0.16) !important;
        }

        /* Top Page Header Bar */
        .mushaf-top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 16px 10px;
            margin-bottom: 14px;
            border-bottom: 2px double #C59B27;
            font-family: 'KFGQPC Uthman Taha Naskh', 'Amiri Quran', 'Amiri', serif;
            font-size: 15px;
            font-weight: 700;
            color: #1A4D2E;
            direction: rtl;
        }

        .mushaf-header-page {
            font-family: 'KFGQPC Uthman Taha Naskh', 'Amiri Quran', 'Amiri', serif;
            font-size: 13px;
            font-weight: 700;
            color: #1A4D2E;
            background: #FFFDF8;
            padding: 2px 10px;
            border-radius: 50%;
            border: 2px solid #C59B27;
            outline: 1px solid #1A4D2E;
            outline-offset: 1px;
            box-shadow: inset 0 0 6px rgba(197, 155, 39, 0.25);
            min-width: 28px;
            text-align: center;
        }

        /* Ornate Border Frame */
        .mushaf-frame-border {
            position: relative;
            border: 3px double #C59B27;
            outline: 3px solid #1A4D2E;
            outline-offset: 4px;
            border-radius: 4px;
            padding: 18px 16px;
            background: #FFFDF8;
            box-shadow: inset 0 0 24px rgba(197, 155, 39, 0.08);
        }

        /* Corner Medallions */
        .mushaf-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #C59B27;
            background: #1A4D2E;
            pointer-events: none;
            z-index: 2;
            box-shadow: 0 0 0 1px #C59B27;
        }

        .mushaf-corner::after {
            content: '';
            position: absolute;
            top: 3px; left: 3px; right: 3px; bottom: 3px;
            background: #C59B27;
            border-radius: 1px;
        }

        .mushaf-corner.corner-tr { top: -5px; right: -5px; border-radius: 0 4px 0 4px; }
        .mushaf-corner.corner-tl { top: -5px; left: -5px; border-radius: 4px 0 4px 0; }
        .mushaf-corner.corner-br { bottom: -5px; right: -5px; border-radius: 4px 0 4px 0; }
        .mushaf-corner.corner-bl { bottom: -5px; left: -5px; border-radius: 0 4px 0 4px; }

        /* Mushaf Line */
        .mushaf-line {
            font-family: 'KFGQPC Uthman Taha Naskh', 'Amiri Quran', 'Scheherazade New', 'Amiri', serif;
            font-size: clamp(16px, 1.8vw, 23px);
            line-height: 2.0;
            direction: rtl;
            margin: 2px 0;
            padding: 0 2px;
            font-weight: 400;
            color: #0F2D4A;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            word-spacing: 0;
            hyphens: none;
        }

        .mushaf-line.bismillah-line {
            font-size: clamp(18px, 2vw, 24px);
            justify-content: center !important;
            color: #F7E7B4;
            line-height: 2.6;
        }

        .mushaf-line .word {
            display: inline;
            cursor: default;
            white-space: nowrap;
            color: #0F2D4A;
        }

        /* Ayah Markers */
        .ayah-marker {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-family: 'KFGQPC Uthman Taha Naskh', 'Amiri Quran', 'Amiri', serif !important;
            font-size: 12px !important;
            font-weight: 700 !important;
            color: #1A4D2E !important;
            margin: 0 3px !important;
            padding: 2px 6px !important;
            border: 2px solid #C59B27 !important;
            outline: 1px solid #1A4D2E !important;
            outline-offset: 1px !important;
            border-radius: 50% !important;
            min-width: 22px !important;
            min-height: 22px !important;
            line-height: 1 !important;
            text-align: center !important;
            vertical-align: middle !important;
            background: radial-gradient(circle, #FFFDF8 40%, rgba(197, 155, 39, 0.15) 100%) !important;
            box-shadow: 0 1px 4px rgba(15, 45, 74, 0.12), inset 0 0 4px rgba(197, 155, 39, 0.25) !important;
        }

        /* Surah Header */
        .mushaf-surah-header {
            margin: 16px auto 12px;
            padding: 10px 20px;
            font-family: 'KFGQPC Uthman Taha Naskh', 'Amiri Quran', 'Amiri', serif;
            background: linear-gradient(135deg, #1A4D2E 0%, #27623C 50%, #1A4D2E 100%);
            border: 2px solid #C59B27;
            outline: 1px solid #C59B27;
            outline-offset: 2px;
            border-radius: 6px;
            box-shadow: inset 0 0 16px rgba(197, 155, 39, 0.4), 0 4px 12px rgba(26, 77, 46, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            direction: rtl;
            color: #FFFDF8;
        }

        .mushaf-surah-header .surah-title {
            font-size: 22px;
            font-weight: 700;
            color: #F7E7B4;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .mushaf-surah-header .surah-meta-badge {
            font-size: 11px;
            font-family: 'KFGQPC Uthman Taha Naskh', 'Amiri Quran', 'Amiri', sans-serif;
            color: #D4AF37;
            font-weight: 600;
            background: rgba(26, 77, 46, 0.85);
            padding: 3px 12px;
            border-radius: 14px;
            border: 1px solid #C59B27;
        }

        /* Page 1 (Al-Fatihah) center lines */
        .page-fatihah .mushaf-line {
            justify-content: center !important;
        }

        /* Loading state */
        .loading {
            color: #888;
            text-align: center;
            padding: 40px;
            font-size: 16px;
        }

        /* Status bar */
        .status-bar {
            color: #888;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
        }

        /* Responsive: stack pages vertically on small screens */
        @media (max-width: 900px) {
            .mushaf-spread {
                flex-direction: column-reverse;
                align-items: center;
                gap: 16px;
            }

            .mushaf-page-container {
                max-width: 600px;
                width: 100%;
                border-radius: 12px !important;
                border: 2px solid #C59B27 !important;
            }

            .mushaf-page-container.page-right,
            .mushaf-page-container.page-left {
                border-radius: 12px !important;
                border: 2px solid #C59B27 !important;
                box-shadow: 0 12px 40px rgba(15,45,74,0.16) !important;
            }
        }
    </style>
</head>

            {num:112, name:"الإِخلَاص", en:"Al-Ikhlas", verses:4, revelationType:"Meccan", pages:[604]},
            {num:113, name:"الفَلَق", en:"Al-Falaq", verses:5, revelationType:"Meccan", pages:[604]},
            {num:114, name:"النَّاس", en:"An-Nas", verses:6, revelationType:"Medinan", pages:[604]}
        ];

        const JUZ_NAMES_AR = [
            "الأول", "الثاني", "الثالث", "الرابع", "الخامس", "السادس", "السابع", "الثامن", "التاسع", "العاشر",
            "الحادي عشر", "الثاني عشر", "الثالث عشر", "الرابع عشر", "الخامس عشر", "السادس عشر", "السابع عشر", "الثامن عشر", "التاسع عشر", "العشرون",
            "الحادي والعشرون", "الثاني والعشرون", "الثالث والعشرون", "الرابع والعشرون", "الخامس والعشرون", "السادس والعشرون", "السابع والعشرون", "الثامن والعشرون", "التاسع والعشرون", "الثلاثون"
        ];

        const JUZ_STARTS = [1, 22, 42, 62, 82, 102, 122, 142, 162, 182, 202, 222, 242, 262, 282, 302, 322, 342, 362, 382, 402, 422, 442, 462, 482, 502, 522, 542, 562, 582];

        function toArabicNumerals(num) {
            return String(num).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
        }

        function getJuzForPage(pageNum) {
            for (let i = JUZ_STARTS.length - 1; i >= 0; i--) {
                if (pageNum >= JUZ_STARTS[i]) return i + 1;
            }
            return 1;
        }

        // ===================== RENDER A SINGLE PAGE INTO A CONTAINER =====================
        async function renderPageInto(pageNum, innerEl, juzEl, pageNumEl, surahNameEl) {
            try {
                const data = await window.QuranAPI.fetchPage(pageNum, true);
                const words = window.QuranAPI.flattenPageWords(data);

                // Update header
                const juzNum = getJuzForPage(pageNum);
                const juzArName = JUZ_NAMES_AR[juzNum - 1] || toArabicNumerals(juzNum);
                if (juzEl) juzEl.textContent = `الجزء ${juzArName}`;
                if (pageNumEl) pageNumEl.textContent = toArabicNumerals(pageNum);

                // Group words by line
                const lines = [];
                let currentLine = null;
                for (let i = 0; i < words.length; i++) {
                    const w = words[i];
                    const ln = w.lineNumber || 0;
                    if (!currentLine || currentLine.lineNumber !== ln) {
                        currentLine = { lineNumber: ln, surah: w.surah, firstAyah: w.ayah, words: [] };
                        lines.push(currentLine);
                    }
                    currentLine.words.push(w);
                }

                // Find first surah on page for header
                const firstSurah = lines[0]?.surah;
                const metaFirst = SURAH_META.find(s => s.num === firstSurah);
                if (surahNameEl && metaFirst) surahNameEl.textContent = `سُورَةُ ${metaFirst.name}`;

                // Find surah boundaries
                const surahStartLineIdx = {};
                let prevSurah = -1;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].surah !== prevSurah) {
                        surahStartLineIdx[lines[i].surah] = i;
                        prevSurah = lines[i].surah;
                    }
                }

                // Render
                innerEl.innerHTML = '';
                if (pageNum === 1) innerEl.classList.add('page-fatihah');
                else innerEl.classList.remove('page-fatihah');

                const frag = document.createDocumentFragment();

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];

                    // Surah header if this is the first line of a surah on this page
                    if (surahStartLineIdx[line.surah] === i) {
                        const meta = SURAH_META.find(s => s.num === line.surah);
                        if (meta && meta.pages && meta.pages[0] === pageNum) {
                            const header = document.createElement('div');
                            header.className = 'mushaf-surah-header';
                            const typeStr = meta.revelationType === 'Meccan' ? 'مَكِّيَّةٌ' : 'مَدَنِيَّةٌ';
                            header.innerHTML = `
                                <span class="surah-meta-badge">${typeStr}</span>
                                <span class="surah-title">سُورَةُ ${meta.name}</span>
                                <span class="surah-meta-badge">آيَاتُهَا ${toArabicNumerals(meta.verses)}</span>
                            `;
                            frag.appendChild(header);

                            // Bismillah
                            if (line.surah !== 1 && line.surah !== 9) {
                                const bisLine = document.createElement('div');
                                bisLine.className = 'mushaf-line bismillah-line';
                                bisLine.textContent = 'بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ';
                                frag.appendChild(bisLine);
                            }
                        }
                    }

                    // Render the line
                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'mushaf-line';

                    for (const w of line.words) {
                        if (w.isEndMarker) {
                            lineDiv.appendChild(document.createTextNode(' '));
                            const marker = document.createElement('span');
                            marker.className = 'ayah-marker';
                            marker.textContent = w.text;
                            lineDiv.appendChild(marker);
                            continue;
                        }
                        lineDiv.appendChild(document.createTextNode(' '));
                        const span = document.createElement('span');
                        span.className = 'word';
                        span.textContent = w.text;
                        lineDiv.appendChild(span);
                    }

                    frag.appendChild(lineDiv);
                }

                innerEl.appendChild(frag);
                return true;
            } catch (e) {
                innerEl.innerHTML = `<div class="loading" style="color:#E74C3C">Failed to load page ${pageNum}: ${e.message}</div>`;
                return false;
            }
        }

        // ===================== LOAD SPREAD (2 PAGES) =====================
        async function loadSpread(rightPage, leftPage) {
            const statusBar = document.getElementById('statusBar');
            statusBar.textContent = `Loading pages ${rightPage} & ${leftPage}...`;

            document.getElementById('rightPageInput').value = rightPage;
            document.getElementById('leftPageInput').value = leftPage;

            await Promise.all([
                renderPageInto(rightPage,
                    document.getElementById('innerRight'),
                    document.getElementById('juzRight'),
                    document.getElementById('pageNumRight'),
                    document.getElementById('surahRight')
                ),
                renderPageInto(leftPage,
                    document.getElementById('innerLeft'),
                    document.getElementById('juzLeft'),
                    document.getElementById('pageNumLeft'),
                    document.getElementById('surahLeft')
                )
            ]);

            statusBar.textContent = `Pages ${rightPage} & ${leftPage} loaded.`;
        }

        // ===================== CONTROLS =====================
        document.getElementById('loadBtn').addEventListener('click', () => {
            const r = parseInt(document.getElementById('rightPageInput').value) || 3;
            const l = parseInt(document.getElementById('leftPageInput').value) || 4;
            loadSpread(r, l);
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            let r = parseInt(document.getElementById('rightPageInput').value) || 3;
            r = Math.max(1, r - 2);
            loadSpread(r, r + 1);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            let r = parseInt(document.getElementById('rightPageInput').value) || 3;
            r = Math.min(603, r + 2);
            loadSpread(r, r + 1);
        });

        // ===================== INITIAL LOAD =====================
        loadSpread(3, 4);
    </script>
