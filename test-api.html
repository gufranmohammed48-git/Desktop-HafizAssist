<!DOCTYPE html>
<html>
<head>
<title>API Integration Test</title>
<style>
body { font-family: monospace; padding: 20px; }
.ok { color: green; }
.fail { color: red; }
pre { background: #f0f0f0; padding: 10px; }
</style>
</head>
<body>
<h1>API Integration Test</h1>
<div id="results"></div>

<!-- Load our actual integration -->
<script src="quran-api.js"></script>
<script src="hybrid-loader.js"></script>

<script>
// Mock SURAH_META, BISMILLAH_WORDS, normalize, phonemizeArabic for testing
const SURAH_META = [];
const BISMILLAH_WORDS = [
  {text: 'بِسْمِ', norm: 'بسم'},
  {text: 'ٱللَّهِ', norm: 'الله'},
  {text: 'ٱلرَّحْمَـٰنِ', norm: 'الرحمن'},
  {text: 'ٱلرَّحِيمِ', norm: 'الرحيم'}
];
function normalize(t){
  return t.replace(/[\u064B-\u0652\u0670\u0640]/g, '').replace(/[إأآاٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
}
function phonemizeArabic(t){ return 'mock_phoneme'; }

let allRefWords = [];
let surahStartIndex = [];
const PAGE_SIZE = 70;

async function testAPI(){
  const log = document.getElementById('results');
  const out = (msg, cls) => log.innerHTML += `<p class="${cls||''}">${msg}</p>`;
  
  out('1. Testing chapters endpoint...');
  try {
    const chapters = await window.HybridLoader.loadChaptersHybrid();
    out(`   ✓ Got ${chapters?.length} chapters`, 'ok');
  } catch(e){
    out(`   ✗ Failed: ${e.message}`, 'fail');
  }
  
  out('2. Testing Al-Fatihah (surah 1) verses...');
  try {
    const words = await window.HybridLoader.loadChapterVersesHybrid(1);
    out(`   ✓ Got ${words?.length} words for surah 1`, 'ok');
    if(words && words.length > 0){
      out(`   First word: text="${words[0].text}", surah=${words[0].surah}, ayah=${words[0].ayah}, position=${words[0].position}`, 'ok');
      out(`   Last word: text="${words[words.length-1].text}", ayah=${words[words.length-1].ayah}`, 'ok');
    }
  } catch(e){
    out(`   ✗ Failed: ${e.message}`, 'fail');
  }
  
  out('3. Testing Al-Baqarah (surah 2) verses...');
  try {
    const words = await window.HybridLoader.loadChapterVersesHybrid(2);
    out(`   ✓ Got ${words?.length} words for surah 2`, 'ok');
  } catch(e){
    out(`   ✗ Failed: ${e.message}`, 'fail');
  }
  
  out('4. Testing cache (load Al-Fatihah again)...');
  const t0 = performance.now();
  const cached = await window.HybridLoader.loadChapterVersesHybrid(1);
  const t1 = performance.now();
  out(`   ✓ Loaded in ${(t1-t0).toFixed(1)}ms (should be <10ms if cached)`, 'ok');
  
  out('5. All tests complete!');
}

testAPI().catch(e => {
  document.getElementById('results').innerHTML += `<p class="fail">FATAL: ${e.message}</p>`;
});
</script>
</body>
</html>
