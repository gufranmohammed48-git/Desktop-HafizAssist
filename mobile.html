<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mobile Test — Al-Fatihah</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0a1f12;color:#e8f5e9;padding:16px;min-height:100vh}
  h1{font-size:18px;margin-bottom:8px;text-align:center}
  h1 .ar{color:#2ecc71;font-family:Amiri,serif;font-size:22px;margin-left:8px}
  .ver{position:fixed;top:8px;right:8px;background:#0a1f12;color:#2ecc71;border:1px solid #2ecc71;padding:2px 6px;border-radius:4px;font-size:11px;font-family:monospace;z-index:10}

  /* Surah display: each ayah on its own line, LTR layout so DOM order = visual order */
  #ayahs{display:flex;flex-direction:column;gap:14px;margin:20px auto;max-width:600px;padding:16px;background:rgba(255,255,255,.04);border-radius:12px;border:1px solid rgba(46,204,113,.2)}
  .ayah-row{display:flex;align-items:flex-start;gap:10px;direction:rtl;font-size:22px;line-height:2}
  .ayah-num{flex:0 0 36px;background:#2ecc71;color:#0a1f12;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;margin-top:4px}
  .ayah-text{flex:1;display:flex;flex-wrap:wrap;gap:4px;direction:rtl}
  .word{display:inline-block;padding:3px 6px;border-radius:5px;transition:all .15s;font-family:Amiri,serif}
  .word.future{color:#7a8a7a;opacity:.75}
  .word.now{background:#2ecc71;color:#0a1f12;font-weight:700;transform:scale(1.08);box-shadow:0 0 14px rgba(46,204,113,.55)}
  .word.past{color:#2ecc71;opacity:.9}
  .word.wrong{color:#e74c3c;background:rgba(231,76,60,.18);text-decoration:line-through}
  .word.unclear{color:#f1c40f;background:rgba(241,196,15,.18)}

  .controls{margin:20px auto;max-width:600px;display:flex;flex-direction:column;gap:10px;align-items:center}
  button{font-family:inherit;font-size:16px;padding:14px 24px;border-radius:30px;border:none;cursor:pointer;font-weight:700;min-width:200px}
  #startBtn{background:#2ecc71;color:#0a1f12}
  #startBtn.listening{background:#e74c3c;color:#fff;animation:pulse 1s ease-in-out infinite}
  #stopBtn{background:#555;color:#fff;display:none}
  .status{text-align:center;font-size:14px;color:#aaa;min-height:24px;margin-top:8px;font-family:monospace}
  .status.live{color:#2ecc71}
  .status.warn{color:#e74c3c}
  .transcript{background:rgba(255,255,255,.04);border:1px solid rgba(46,204,113,.2);border-radius:8px;padding:12px;margin:16px auto;max-width:600px;min-height:60px;font-size:15px;line-height:1.5}
  .transcript-label{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:700}
  .log{background:#000;color:#2ecc71;font-family:monospace;font-size:11px;padding:8px;border-radius:6px;margin:12px auto;max-width:600px;max-height:200px;overflow:auto;line-height:1.4;white-space:pre-wrap;word-break:break-word}
  .log-label{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:1px;margin:16px auto 6px;max-width:600px;font-weight:700}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
</style>
</head>
<body>

<div class="ver">v1.5</div>
<h1>Al-Fatihah Test <span class="ar">الفاتحة</span></h1>
<div style="text-align:center;color:#888;font-size:12px;margin-bottom:8px">Minimal mobile test — tap Stop when done</div>

<div id="ayahs">Loading…</div>

<div class="controls">
  <button id="startBtn">▶ Start reciting (30s)</button>
  <button id="stopBtn">⏹ Stop</button>
  <div class="status" id="status">Tap Start, then speak when the button turns red.</div>
</div>

<div style="max-width:600px;margin:0 auto">
  <div class="transcript-label">What the browser heard</div>
  <div class="transcript" id="transcript">—</div>
</div>

<div class="log-label">Live event log</div>
<div class="log" id="log"></div>

<script src="phonemes-data.js"></script>
<script>
(function(){
  // ---------- TINY LOGGER ----------
  const logEl = document.getElementById('log');
  const log = (kind, msg) => {
    const t = new Date().toLocaleTimeString();
    const line = `[${t}] ${kind}: ${msg}`;
    logEl.textContent = (logEl.textContent ? logEl.textContent + '\n' : '') + line;
    logEl.scrollTop = logEl.scrollHeight;
  };

  // ---------- UI REFS ----------
  const startBtn = document.getElementById('startBtn');
  const stopBtn  = document.getElementById('stopBtn');
  const statusEl = document.getElementById('status');
  const ayahsEl  = document.getElementById('ayahs');
  const transcriptEl = document.getElementById('transcript');

  // ---------- BUILD FATIHAH ----------
  // SURAH_PHONEMES[surah_str][ayah_str][position_str] = [text, phoneme, rules]
  // THREE LEVELS OF STRING-KEYED OBJECTS, not arrays.
  // Each ayah rendered as its own row: a circular verse number + the words
  // flowing RTL with explicit LTR flex layout so DOM order = visual order.
  const refWords = []; // [{text, norm, el, surah, ayah, position}]
  const surahData = window.SURAH_PHONEMES && window.SURAH_PHONEMES['1'];
  if(!surahData){
    ayahsEl.textContent = 'ERROR: SURAH_PHONEMES data failed to load';
    log('ERROR', 'SURAH_PHONEMES[1] is ' + typeof window.SURAH_PHONEMES);
    return;
  }
  // Clear the "Loading…" text before rendering
  ayahsEl.innerHTML = '';
  for(let a = 1; a <= 7; a++){
    const ayahObj = surahData[String(a)];
    if(!ayahObj) continue;
    // Build a row for this ayah
    const row = document.createElement('div');
    row.className = 'ayah-row';
    // Verse number on the LEFT (in LTR flex layout it appears first)
    const num = document.createElement('div');
    num.className = 'ayah-num';
    num.textContent = a;
    row.appendChild(num);
    // Word container flowing RTL
    const text = document.createElement('div');
    text.className = 'ayah-text';
    const positions = Object.keys(ayahObj).map(Number).sort((x,y)=>x-y);
    for(const p of positions){
      const wordArr = ayahObj[String(p)];
      if(!Array.isArray(wordArr)) continue;
      const wordText = wordArr[0];
      const w = document.createElement('span');
      w.className = 'word future';
      w.textContent = wordText;
      w.dataset.text = wordText;
      text.appendChild(w);
      refWords.push({text: wordText, norm: normalize(wordText), el: w, surah: 1, ayah: a, position: p});
    }
    row.appendChild(text);
    ayahsEl.appendChild(row);
  }
  function normalize(s){
    return (s||'')
      .replace(/[\u064B-\u0652\u0670\u0640]/g, '') // remove tashkeel + tatweel
      .replace(/[إأآاٱ]/g, 'ا')   // normalize ALL alif variants INCLUDING alif wasla ٱ (U+0671)
      .replace(/ى/g, 'ي')          // ya
      .replace(/ة/g, 'ه')          // ta marbuta
      .replace(/[^\u0600-\u06FF\s]/g, '')
      .trim();
  }
  // Levenshtein distance for fuzzy match fallback
  function levenshtein(a, b){
    const m = a.length, n = b.length;
    if(!m) return n; if(!n) return m;
    const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
    for(let i=0;i<=m;i++) dp[i][0] = i;
    for(let j=0;j<=n;j++) dp[0][j] = j;
    for(let i=1;i<=m;i++){
      for(let j=1;j<=n;j++){
        dp[i][j] = a[i-1] === b[j-1]
          ? dp[i-1][j-1]
          : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
      }
    }
    return dp[m][n];
  }
  // Try to find a match for a normalized word starting at position p.
  // Returns the matched index, or -1 if no reasonable match found.
  // Strategy:
  //   1. exact match in [p, p+NEAR)
  //   2. starts-with match in [p, p+NEAR)
  //   3. fuzzy match (Levenshtein ≤ 1) in [p, p+NEAR)
  //   4. exact match ANYWHERE in refWords (in case the user skipped ahead)
  function findMatch(w, p){
    const NEAR = 12;
    const end = Math.min(refWords.length, p + NEAR);
    // 1 & 2: exact / starts-with in the near window
    for(let i = p; i < end; i++){
      if(refWords[i].norm === w) return {idx:i, kind:'exact'};
    }
    for(let i = p; i < end; i++){
      if(refWords[i].norm.startsWith(w) && w.length >= 2) return {idx:i, kind:'prefix'};
      if(w.startsWith(refWords[i].norm) && refWords[i].norm.length >= 2) return {idx:i, kind:'prefix'};
    }
    // 3: fuzzy in the near window (1 edit tolerance)
    for(let i = p; i < end; i++){
      const d = levenshtein(refWords[i].norm, w);
      const tol = Math.max(1, Math.floor(Math.max(refWords[i].norm.length, w.length) * 0.25));
      if(d <= tol) return {idx:i, kind:'fuzzy', dist:d};
    }
    return {idx:-1, kind:'none'};
  }

  // ---------- MATCHING ----------
  let pointer = 0;
  let _stats = {correct:0, mistake:0, unclear:0};
  function setClass(el, cls){
    el.classList.remove('future','now','past','wrong','unclear');
    el.classList.add(cls);
  }
  function matchText(text){
    const heard = (text||'').split(/\s+/).map(normalize).filter(Boolean);
    if(!heard.length) return;
    log('MATCH', 'heard=' + JSON.stringify(heard) + ' from p=' + pointer);
    let p = pointer;
    for(const w of heard){
      const m = findMatch(w, p);
      if(m.idx >= 0){
        // mark skipped words as unclear
        for(let i = p; i < m.idx; i++){
          if(refWords[i].el.dataset.status !== 'correct'){
            setClass(refWords[i].el, 'unclear');
            refWords[i].el.dataset.status = 'unclear';
          }
        }
        setClass(refWords[m.idx].el, 'past');
        refWords[m.idx].el.dataset.status = 'correct';
        _stats.correct++;
        log('MATCH', '"' + w + '" → refWords[' + m.idx + ']="' + refWords[m.idx].norm + '" (' + m.kind + (m.dist?', d='+m.dist:'') + ')');
        p = m.idx + 1;
      } else {
        if(p < refWords.length){
          setClass(refWords[p].el, 'wrong');
          refWords[p].el.dataset.status = 'wrong';
          _stats.mistake++;
          log('MATCH', '"' + w + '" → WRONG at refWords[' + p + ']="' + refWords[p].norm + '"');
          p++;
        }
      }
    }
    pointer = Math.min(p, refWords.length);
    if(pointer < refWords.length) setClass(refWords[pointer].el, 'now');
    if(pointer > 0 && refWords[pointer-1].el.classList.contains('now')) setClass(refWords[pointer-1].el, 'past');
  }

  // ---------- SPEECH RECOGNITION ----------
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Ctor){
    statusEl.textContent = 'This browser does not support the Web Speech API.';
    statusEl.classList.add('warn');
    return;
  }

  let recognition = null;
  let running = false;

  function startSession(){
    recognition = new Ctor();
    recognition.lang = 'ar';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = (e) => {
      let txt = '';
      for(let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
      log('RESULT', '"' + txt + '"');
      transcriptEl.textContent = txt;
      matchText(txt);
    };
    recognition.onerror = (e) => {
      log('ERROR', e.error + (e.message ? ' — ' + e.message : ''));
      statusEl.textContent = 'Error: ' + e.error;
      statusEl.classList.add('warn');
    };
    recognition.onend = () => {
      log('END', 'session ended');
      if(!running) return;
      // Auto-restart to keep listening. Android Chrome ends the session
      // after a few seconds of silence. Restart immediately so the user
      // doesn't have to keep tapping.
      setTimeout(() => {
        if(!running) return;
        try {
          recognition.start();
          log('START', 'auto-restarted after silence');
        } catch(e){
          log('ERROR', 'auto-restart failed: ' + e.message);
        }
      }, 200);
      statusEl.textContent = '🔁 Listening (tap Stop when done)';
    };
    recognition.onaudiostart = () => log('AUDIO', 'mic live');
    recognition.onaudioend   = () => log('AUDIO', 'mic off');
    try{
      recognition.start();
      running = true;
      startBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';
      statusEl.textContent = '🎤 Listening (30s) — speak now!';
      statusEl.classList.add('live');
      statusEl.classList.remove('warn');
      log('START', 'recognition started (lang=ar, continuous=false)');
      // No auto-stop. The user taps Stop when done. Android Chrome
      // ends the session naturally after a few seconds of silence
      // and we restart it ourselves to keep listening.
      // (no setTimeout)
    }catch(e){
      log('THROW', e.message);
      statusEl.textContent = 'Could not start: ' + e.message;
      statusEl.classList.add('warn');
    }
  }

  function stopSession(){
    running = false;
    if(recognition){
      try { recognition.stop(); } catch(_){}
    }
    startBtn.style.display = 'inline-block';
    stopBtn.style.display = 'none';
    statusEl.textContent = 'Stopped. Press Start to recite again.';
    statusEl.classList.remove('live');
  }

  startBtn.addEventListener('click', startSession);
  stopBtn.addEventListener('click', stopSession);

  log('INFO', 'page loaded, ' + refWords.length + ' words in Al-Fatihah');
  log('INFO', 'SpeechRecognition class: ' + (Ctor.name || 'available'));
  log('INFO', 'protocol: ' + location.protocol + ', isSecureContext: ' + window.isSecureContext);
  log('INFO', 'userAgent: ' + navigator.userAgent);
})();
</script>
</body>
</html>
