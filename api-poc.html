<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Quran.com API Proof of Concept</title>
<style>
body { background: #fafaf5; color: #1a3a1a; font-family: 'Amiri', serif; padding: 20px; max-width: 1000px; margin: 0 auto; }
h1 { color: #2e7d32; }
.page { background: #fff; border: 1px solid #ccc; border-radius: 12px; padding: 24px; margin: 20px 0; }
.line { margin: 8px 0; direction: rtl; text-align: justify; font-size: 24px; line-height: 2.2; }
.line-num { color: #999; font-size: 12px; margin-left: 8px; }
.word { padding: 2px 3px; }
.end { color: #2e7d32; font-weight: bold; margin: 0 4px; }
.verse-num { background: #2e7d32; color: #fff; border-radius: 50%; padding: 2px 8px; font-size: 12px; margin: 0 4px; }
.verse-text { color: #555; font-size: 12px; }
.controls { display: flex; gap: 10px; align-items: center; margin: 20px 0; flex-wrap: wrap; }
button { background: #2e7d32; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
input { padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
.stats { background: #f0f0f0; padding: 10px; border-radius: 6px; margin: 10px 0; }
.missing { background: #fff3cd; border: 1px solid #ffc107; padding: 10px; border-radius: 6px; margin: 10px 0; }
pre { background: #f0f0f0; padding: 10px; border-radius: 6px; overflow: auto; font-size: 11px; max-height: 300px; }
.warn { color: #d32f2f; }
.ok { color: #388e3c; }
</style>
</head>
<body>
<h1>Quran.com API Proof of Concept</h1>

<div class="controls">
  <label>Page: <input type="number" id="pageNum" value="1" min="1" max="604"></label>
  <button id="loadBtn">Load Page</button>
  <button id="loadAllBtn">Load Pages 1-3</button>
  <span id="status">Ready</span>
</div>

<div id="stats" class="stats" style="display:none"></div>

<div id="missing" class="missing" style="display:none"></div>

<div id="output" class="page">
  <p>Click "Load Page" to fetch from Quran.com API.</p>
</div>

<h2>Raw API Response (first 2000 chars):</h2>
<pre id="rawOutput">-</pre>

<script>
const API_BASE = 'https://api.quran.com/api/v4';

async function fetchPage(pageNum){
  const url = `${API_BASE}/verses/by_page/${pageNum}?language=en&fields=text_uthmani&words=true&word_fields=text_uthmani,text_imlaei,transliteration,line_number,char_type_name`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
}

// Group words by line_number for mushaf-style rendering
function groupWordsByLine(verses){
  const lines = [];
  let currentLine = null;
  for(const v of verses){
    for(const w of v.words || []){
      const ln = w.line_number;
      if(!ln) continue;
      if(!currentLine || currentLine.line !== ln){
        currentLine = { line: ln, words: [] };
        lines.push(currentLine);
      }
      currentLine.words.push({...w, verse: v.verse_key, verseNumber: v.verse_number});
    }
  }
  return lines;
}

function renderPage(data){
  const html = [];
  html.push(`<h2>Page ${data.page_number || '?'} of 604</h2>`);
  
  // Stats
  let totalWords = 0, totalEnd = 0, totalLines = new Set();
  for(const v of data.verses){
    for(const w of v.words || []){
      if(w.char_type_name === 'word') totalWords++;
      if(w.char_type_name === 'end') totalEnd++;
      if(w.line_number) totalLines.add(w.line_number);
    }
  }
  
  document.getElementById('stats').style.display = 'block';
  document.getElementById('stats').innerHTML = `
    <strong>Verses on page:</strong> ${data.verses.length} | 
    <strong>Words:</strong> ${totalWords} | 
    <strong>Lines:</strong> ${totalLines.size} | 
    <strong>End markers (verse #):</strong> ${totalEnd} | 
    <strong>Page:</strong> ${data.page_number}
  `;
  
  // Group by line
  const lines = groupWordsByLine(data.verses);
  for(const line of lines){
    let lineHtml = `<div class="line">`;
    for(const w of line.words){
      if(w.char_type_name === 'end'){
        // End-of-verse marker (e.g., ﴿﴾ or verse number)
        lineHtml += `<span class="verse-num">${w.text_uthmani}</span> `;
      } else if(w.char_type_name === 'pause'){
        lineHtml += `<span class="word">${w.text_uthmani}</span> `;
      } else {
        lineHtml += `<span class="word">${w.text_uthmani}</span> `;
      }
    }
    lineHtml += `</div>`;
    html.push(lineHtml);
  }
  
  // Check what's missing
  const missing = [];
  // Bismillah: would appear in surahs 2-114 except 9 at the start of a page
  // We can detect by checking if the first word of the first verse on this page 
  // is a Bismillah word (e.g., "بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ")
  const firstVerseText = data.verses[0]?.text_uthmani || '';
  if(firstVerseText.startsWith('بِسْمِ') && firstVerseText.includes('ٱلرَّحْمَـٰنِ')){
    // Bismillah is verse 1 of Al-Fatihah, so it's included
  } else if(data.verses[0]?.verse_key !== '1:1' && !data.verses.some(v => v.verse_number === 1)){
    // Page starts with a surah but no verse 1 = Bismillah might be missing
    const firstVerse = data.verses[0];
    if(firstVerse && !firstVerse.text_uthmani.startsWith('بِسْمِ')){
      missing.push('Bismillah (بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ) at the start of the surah');
    }
  }
  // Surah header info
  missing.push('Surah header (Arabic name + transliteration + meaning)');
  // Tajweed rules
  missing.push('Tajweed rules (color coding: ghunna, qalqala, madd, etc.)');
  // Visual position info
  missing.push('Precise visual positioning (center-justified mushaf layout)');
  
  document.getElementById('missing').style.display = 'block';
  document.getElementById('missing').innerHTML = `
    <strong>⚠️ The API gives us the text, but we need to add these ourselves to make it look like a real mushaf:</strong>
    <ul>${missing.map(m => `<li>${m}</li>`).join('')}</ul>
    <p><strong>Good news:</strong> Our existing <code>phonemes-data.js</code> HAS these (Tajweed rules). We can keep it for that, OR generate them on the fly from the text.</p>
  `;
  
  return html.join('');
}

async function loadAndRender(pageNum){
  const status = document.getElementById('status');
  const output = document.getElementById('output');
  const raw = document.getElementById('rawOutput');
  status.innerHTML = `<span class="warn">Loading page ${pageNum}...</span>`;
  try {
    const data = await fetchPage(pageNum);
    status.innerHTML = `<span class="ok">✓ Loaded ${data.verses.length} verses from page ${data.page_number}</span>`;
    output.innerHTML = renderPage(data);
    raw.textContent = JSON.stringify(data, null, 2).substring(0, 2000);
  } catch(e) {
    status.innerHTML = `<span class="warn">✗ Error: ${e.message}</span>`;
    output.innerHTML = '<p>Failed to load.</p>';
  }
}

document.getElementById('loadBtn').addEventListener('click', () => {
  const pageNum = parseInt(document.getElementById('pageNum').value);
  loadAndRender(pageNum);
});

document.getElementById('loadAllBtn').addEventListener('click', async () => {
  for(let p = 1; p <= 3; p++){
    await loadAndRender(p);
    await new Promise(r => setTimeout(r, 500));
  }
});

window.addEventListener('load', () => {
  loadAndRender(1);
});
</script>
</body>
</html>
