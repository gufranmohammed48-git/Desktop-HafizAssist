<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HafizAssist – Mobile speech test</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
    body { margin: 0; background: #f3f7f2; color: #172018; }
    main { max-width: 850px; margin: auto; padding: 20px; }
    .card { background: white; border-radius: 18px; padding: 22px; box-shadow: 0 8px 28px #17321d18; }
    h1 { margin-top: 0; color: #176b3a; }
    #quran { direction: rtl; text-align: right; font-family: "Noto Naskh Arabic", serif; font-size: clamp(1.8rem, 6vw, 2.7rem); line-height: 2.15; }
    .word { display: inline-block; padding: 0 .12em; border-radius: .25em; transition: background .15s; }
    .matched { background: #99e6ad; color: #102d17; }
    .current { background: #ffe58f; color: #382c00; }
    .missed { text-decoration: underline wavy #d83232; text-decoration-thickness: 2px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
    button { min-height: 48px; border: 0; border-radius: 999px; padding: 0 22px; font: inherit; font-weight: 700; background: #176b3a; color: white; }
    button.secondary { background: #56635a; }
    button:disabled { opacity: .45; }
    #status { min-height: 1.5em; font-weight: 650; }
    #heard { direction: rtl; min-height: 1.5em; color: #526057; overflow-wrap: anywhere; }
    .stats { display: flex; gap: 24px; flex-wrap: wrap; }
    .notice { border-left: 4px solid #d69e00; padding-left: 12px; }
    @media (prefers-color-scheme: dark) { body { background: #111712; color: #edf4ea; } .card { background: #182019; } }
  </style>
</head>
<body>
<main><section class="card">
  <h1>HafizAssist speech test</h1>
  <p id="support" class="notice" hidden></p>
  <div id="quran" lang="ar" aria-label="Surah Al-Fatiha"></div>
  <div class="controls">
    <button id="start" type="button">Start reciting</button>
    <button id="stop" class="secondary" type="button" disabled>Stop</button>
    <button id="reset" class="secondary" type="button">Reset</button>
  </div>
  <p id="status" role="status" aria-live="polite">Tap “Start reciting” to grant microphone access.</p>
  <p id="heard" aria-live="polite"></p>
  <div class="stats"><strong>Matched: <span id="matched">0</span></strong><strong>Unclear/skipped: <span id="errors">0</span></strong></div>
</section></main>
<script>
(() => {
  "use strict";
  const verse = `بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ الرَّحْمَنِ الرَّحِيمِ مَالِكِ يَوْمِ الدِّينِ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ`;
  const words = verse.split(/\s+/);
  const quran = document.querySelector("#quran");
  const startButton = document.querySelector("#start");
  const stopButton = document.querySelector("#stop");
  const resetButton = document.querySelector("#reset");
  const status = document.querySelector("#status");
  const heard = document.querySelector("#heard");
  const matched = document.querySelector("#matched");
  const errors = document.querySelector("#errors");
  const support = document.querySelector("#support");
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let running = false;
  let shouldRestart = false;
  let cursor = 0;
  let errorCount = 0;

  // Chrome's Arabic results often omit tashkeel and spelling marks.
  const normalize = value => value
    .normalize("NFKD")
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, "")
    .replace(/[ٱأإآ]/g, "ا").replace(/ى/g, "ي").replace(/ؤ/g, "و").replace(/ئ/g, "ي")
    .replace(/ة/g, "ه").replace(/[^\u0621-\u064A\s]/g, " ").replace(/\s+/g, " ").trim();
  const targets = words.map(normalize);

  function render() {
    quran.replaceChildren(...words.flatMap((word, index) => {
      const span = document.createElement("span");
      span.className = `word${index < cursor ? " matched" : index === cursor ? " current" : ""}`;
      span.textContent = word;
      return index === words.length - 1 ? [span] : [span, document.createTextNode(" ")];
    }));
    matched.textContent = String(cursor);
    errors.textContent = String(errorCount);
  }

  function consume(transcript) {
    const spoken = normalize(transcript).split(" ").filter(Boolean);
    for (const token of spoken) {
      if (cursor >= targets.length) break;
      let found = -1;
      // A small look-ahead tolerates a missed word without losing the entire recitation.
      for (let index = cursor; index < Math.min(cursor + 4, targets.length); index += 1) {
        if (targets[index] === token || targets[index].includes(token) || token.includes(targets[index])) {
          found = index;
          break;
        }
      }
      if (found >= 0) {
        errorCount += found - cursor;
        cursor = found + 1;
      }
    }
    render();
    if (cursor === targets.length) {
      shouldRestart = false;
      status.textContent = "Surah completed.";
      recognition?.stop();
    }
  }

  function makeRecognition() {
    const instance = new SpeechRecognition();
    instance.lang = "ar-SA";
    // Android Chrome is more reliable with short sessions; onend restarts them.
    instance.continuous = false;
    instance.interimResults = true;
    instance.maxAlternatives = 1;
    instance.onstart = () => {
      running = true;
      startButton.disabled = true;
      stopButton.disabled = false;
      status.textContent = "Listening… recite Al-Fatiha.";
    };
    instance.onresult = event => {
      let preview = "";
      for (let index = event.resultIndex; index < event.results.length; index += 1) {
        const text = event.results[index][0].transcript;
        preview += `${text} `;
        // Only consume final results. Re-consuming changing interim results skips words.
        if (event.results[index].isFinal) consume(text);
      }
      heard.textContent = preview.trim();
    };
    instance.onerror = event => {
      if (["not-allowed", "service-not-allowed", "audio-capture"].includes(event.error)) shouldRestart = false;
      status.textContent = `Speech recognition error: ${event.error}.`;
    };
    instance.onend = () => {
      running = false;
      if (shouldRestart && cursor < targets.length) {
        status.textContent = "Restarting listening…";
        window.setTimeout(() => { try { instance.start(); } catch (_) { shouldRestart = false; } }, 250);
      } else {
        startButton.disabled = false;
        stopButton.disabled = true;
      }
    };
    return instance;
  }

  startButton.addEventListener("click", () => {
    if (!SpeechRecognition) return;
    // start() remains directly inside the tap handler, important on mobile Chrome.
    recognition ??= makeRecognition();
    shouldRestart = true;
    try { recognition.start(); } catch (_) { status.textContent = running ? "Already listening." : "Could not start recognition."; }
  });
  stopButton.addEventListener("click", () => { shouldRestart = false; recognition?.stop(); status.textContent = "Stopped."; });
  resetButton.addEventListener("click", () => { shouldRestart = false; recognition?.stop(); cursor = 0; errorCount = 0; heard.textContent = ""; status.textContent = "Ready to start again."; render(); });

  if (!SpeechRecognition) {
    support.hidden = false;
    support.textContent = "This browser does not expose the Web Speech Recognition API. Try current Chrome on Android or desktop and serve this page over HTTPS.";
    startButton.disabled = true;
  } else if (!window.isSecureContext) {
    support.hidden = false;
    support.textContent = "Microphone recognition requires HTTPS (localhost is also allowed).";
  }
  render();
})();
</script>
</body>
</html>
