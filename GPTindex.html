<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12633b">
  <title>HafizAssist Quran Recitation Tracker</title>
  <style>
    :root { font-family: Inter,system-ui,sans-serif; color:#17231b; background:#f3f7f3; --green:#12633b; --gold:#e5ae2b; }
    * { box-sizing:border-box } body { margin:0 } button,select { font:inherit }
    header { color:white; background:linear-gradient(135deg,#0d4f30,#16824b); padding:22px max(18px,calc((100% - 1100px)/2)); }
    header h1 { margin:0 0 5px; font-size:clamp(1.6rem,5vw,2.3rem) } header p { margin:0; opacity:.9 }
    main { max-width:1100px; margin:auto; padding:18px; display:grid; gap:16px }
    .card { background:white; border:1px solid #dce7de; border-radius:18px; padding:20px; box-shadow:0 8px 25px #13391e12 }
    .toolbar,.buttons,.stats { display:flex; flex-wrap:wrap; gap:12px; align-items:end }
    label { display:grid; gap:6px; font-weight:750; flex:1; min-width:220px }
    select { min-height:48px; padding:0 12px; border:1px solid #a9b9ad; border-radius:10px; background:white; color:inherit }
    button { min-height:48px; border:0; border-radius:999px; padding:0 21px; font-weight:800; color:white; background:var(--green); cursor:pointer }
    button.secondary { background:#59675e } button.danger { background:#a83434 } button:disabled { opacity:.45; cursor:not-allowed }
    .stat { flex:1; min-width:135px; padding:14px; border-radius:14px; background:#f0f6f1 }
    .stat b { display:block; font-size:1.7rem; color:var(--green) }
    progress { width:100%; height:13px; accent-color:var(--green) }
    #quran { direction:rtl; text-align:right; font-family:"Noto Naskh Arabic","Traditional Arabic",serif; font-size:clamp(1.75rem,5vw,2.6rem); line-height:2.25 }
    .word { display:inline-block; padding:0 .1em; border-radius:.25em; transition:.12s }
    .matched { background:#a8e6b7; color:#0d3519 }.current { background:#ffe18a; color:#3c2e00 }.missed { background:#ffd4d4; color:#671919; text-decoration:underline wavy #c52424 }
    #status { font-weight:750; min-height:1.5em }.notice { border-left:4px solid var(--gold); background:#fff9e9; padding:12px }
    #heard { direction:rtl; text-align:right; overflow-wrap:anywhere; min-height:1.5em }
    table { width:100%; border-collapse:collapse } th,td { padding:10px; border-bottom:1px solid #e1e8e2; text-align:left } td.ar { direction:rtl; text-align:right; font-size:1.15rem }
    .scroll { overflow:auto; max-height:320px }.muted { color:#5d6c61 }.hidden { display:none!important }
    @media(max-width:600px){ main{padding:10px}.card{padding:15px}.buttons button{flex:1} }
    @media(prefers-color-scheme:dark){:root{color:#edf5ee;background:#101711}.card{background:#172019;border-color:#304034}.stat{background:#202c23}select{background:#101711;border-color:#526456}.notice{background:#332d19}.muted{color:#bac8bd}}
  </style>
</head>
<body>
<header><h1>HafizAssist</h1><p>Live Quran recitation and mistake tracker</p></header>
<main>
  <section class="card">
    <div class="toolbar">
      <label>Choose a chapter (Surah)<select id="surah"></select></label>
      <button id="load" type="button">Load chapter</button>
    </div>
    <p id="support" class="notice hidden"></p>
  </section>

  <section class="stats" aria-label="Recitation statistics">
    <div class="stat"><span>Words completed</span><b id="matched">0</b></div>
    <div class="stat"><span>Mistakes / unclear</span><b id="errors">0</b></div>
    <div class="stat"><span>Accuracy</span><b id="accuracy">100%</b></div>
    <div class="stat"><span>Chapter progress</span><b id="percent">0%</b></div>
  </section>

  <section class="card">
    <h2 id="chapterTitle">Loading Al-Fatiha…</h2>
    <progress id="progress" max="100" value="0"></progress>
    <div class="buttons">
      <button id="start" type="button">🎙 Start reciting</button>
      <button id="stop" class="danger" type="button" disabled>Stop</button>
      <button id="reset" class="secondary" type="button">Reset progress</button>
    </div>
    <p id="status" role="status" aria-live="polite">Load a chapter, then tap “Start reciting.”</p>
    <p class="muted">Recognized speech:</p><p id="heard" lang="ar" aria-live="polite">—</p>
  </section>

  <section class="card"><div id="quran" lang="ar" aria-label="Quran chapter text"></div></section>

  <section class="card">
    <h2>Mistake details</h2>
    <p id="noMistakes" class="muted">No skipped or unclear words recorded.</p>
    <div class="scroll"><table id="mistakeTable" class="hidden"><thead><tr><th>#</th><th>Expected word</th><th>Heard near it</th></tr></thead><tbody id="mistakes"></tbody></table></div>
  </section>
</main>
<script>
(() => {
  "use strict";
  const chapters = [
    "Al-Fatihah|الفاتحة","Al-Baqarah|البقرة","Ali 'Imran|آل عمران","An-Nisa|النساء","Al-Ma'idah|المائدة","Al-An'am|الأنعام","Al-A'raf|الأعراف","Al-Anfal|الأنفال","At-Tawbah|التوبة","Yunus|يونس","Hud|هود","Yusuf|يوسف","Ar-Ra'd|الرعد","Ibrahim|إبراهيم","Al-Hijr|الحجر","An-Nahl|النحل","Al-Isra|الإسراء","Al-Kahf|الكهف","Maryam|مريم","Taha|طه","Al-Anbiya|الأنبياء","Al-Hajj|الحج","Al-Mu'minun|المؤمنون","An-Nur|النور","Al-Furqan|الفرقان","Ash-Shu'ara|الشعراء","An-Naml|النمل","Al-Qasas|القصص","Al-Ankabut|العنكبوت","Ar-Rum|الروم","Luqman|لقمان","As-Sajdah|السجدة","Al-Ahzab|الأحزاب","Saba|سبأ","Fatir|فاطر","Ya-Sin|يس","As-Saffat|الصافات","Sad|ص","Az-Zumar|الزمر","Ghafir|غافر","Fussilat|فصلت","Ash-Shuraa|الشورى","Az-Zukhruf|الزخرف","Ad-Dukhan|الدخان","Al-Jathiyah|الجاثية","Al-Ahqaf|الأحقاف","Muhammad|محمد","Al-Fath|الفتح","Al-Hujurat|الحجرات","Qaf|ق","Adh-Dhariyat|الذاريات","At-Tur|الطور","An-Najm|النجم","Al-Qamar|القمر","Ar-Rahman|الرحمن","Al-Waqi'ah|الواقعة","Al-Hadid|الحديد","Al-Mujadila|المجادلة","Al-Hashr|الحشر","Al-Mumtahanah|الممتحنة","As-Saf|الصف","Al-Jumu'ah|الجمعة","Al-Munafiqun|المنافقون","At-Taghabun|التغابن","At-Talaq|الطلاق","At-Tahrim|التحريم","Al-Mulk|الملك","Al-Qalam|القلم","Al-Haqqah|الحاقة","Al-Ma'arij|المعارج","Nuh|نوح","Al-Jinn|الجن","Al-Muzzammil|المزمل","Al-Muddaththir|المدثر","Al-Qiyamah|القيامة","Al-Insan|الإنسان","Al-Mursalat|المرسلات","An-Naba|النبأ","An-Nazi'at|النازعات","Abasa|عبس","At-Takwir|التكوير","Al-Infitar|الإنفطار","Al-Mutaffifin|المطففين","Al-Inshiqaq|الإنشقاق","Al-Buruj|البروج","At-Tariq|الطارق","Al-A'la|الأعلى","Al-Ghashiyah|الغاشية","Al-Fajr|الفجر","Al-Balad|البلد","Ash-Shams|الشمس","Al-Layl|الليل","Ad-Duhaa|الضحى","Ash-Sharh|الشرح","At-Tin|التين","Al-Alaq|العلق","Al-Qadr|القدر","Al-Bayyinah|البينة","Az-Zalzalah|الزلزلة","Al-Adiyat|العاديات","Al-Qari'ah|القارعة","At-Takathur|التكاثر","Al-Asr|العصر","Al-Humazah|الهمزة","Al-Fil|الفيل","Quraysh|قريش","Al-Ma'un|الماعون","Al-Kawthar|الكوثر","Al-Kafirun|الكافرون","An-Nasr|النصر","Al-Masad|المسد","Al-Ikhlas|الإخلاص","Al-Falaq|الفلق","An-Nas|الناس"
  ];
  const fallbackFatiha = ["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ","الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","الرَّحْمَٰنِ الرَّحِيمِ","مَالِكِ يَوْمِ الدِّينِ","إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ","اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ","صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ"];
  const $ = selector => document.querySelector(selector);
  const els = { surah:$("#surah"),load:$("#load"),start:$("#start"),stop:$("#stop"),reset:$("#reset"),quran:$("#quran"),status:$("#status"),heard:$("#heard"),support:$("#support"),title:$("#chapterTitle"),matched:$("#matched"),errors:$("#errors"),accuracy:$("#accuracy"),percent:$("#percent"),progress:$("#progress"),mistakes:$("#mistakes"),mistakeTable:$("#mistakeTable"),noMistakes:$("#noMistakes") };
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let words=[],targets=[],cursor=0,errorCount=0,recognition=null,running=false,shouldRestart=false,mistakeLog=[];

  chapters.forEach((chapter,index) => { const [english,arabic]=chapter.split("|"); const option=document.createElement("option"); option.value=String(index+1); option.textContent=`${index+1}. ${english} — ${arabic}`; els.surah.append(option); });

  const normalize = value => value.normalize("NFKD").replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"").replace(/[ٱأإآ]/g,"ا").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/ة/g,"ه").replace(/[^\u0621-\u064A\s]/g," ").replace(/\s+/g," ").trim();
  const similar = (a,b) => a===b || (a.length>2 && b.length>2 && (a.includes(b)||b.includes(a)));

  function stopRecognition(){ shouldRestart=false; if(recognition && running) recognition.stop(); }
  function resetProgress(){ stopRecognition(); cursor=0; errorCount=0; mistakeLog=[]; els.heard.textContent="—"; els.status.textContent="Ready to recite."; render(); }
  function render(){
    const fragment=document.createDocumentFragment();
    words.forEach((word,index)=>{ const span=document.createElement("span"); span.className=`word${index<cursor?" matched":index===cursor?" current":""}`; span.textContent=word; fragment.append(span,document.createTextNode(" ")); });
    els.quran.replaceChildren(fragment);
    const attempted=cursor+errorCount, accuracy=attempted?Math.round(cursor/attempted*100):100,percent=words.length?Math.round(cursor/words.length*100):0;
    els.matched.textContent=String(cursor); els.errors.textContent=String(errorCount); els.accuracy.textContent=`${accuracy}%`; els.percent.textContent=`${percent}%`; els.progress.value=percent;
    els.mistakes.replaceChildren(...mistakeLog.map((item,index)=>{ const row=document.createElement("tr"); const n=document.createElement("td"),expected=document.createElement("td"),heard=document.createElement("td"); n.textContent=String(index+1); expected.textContent=item.expected; expected.className="ar"; heard.textContent=item.heard||"Unclear / skipped"; heard.className="ar"; row.append(n,expected,heard); return row; }));
    els.mistakeTable.classList.toggle("hidden",!mistakeLog.length); els.noMistakes.classList.toggle("hidden",Boolean(mistakeLog.length));
    els.quran.querySelector(".current")?.scrollIntoView({block:"center",behavior:"smooth"});
  }

  function consume(transcript){
    const spoken=normalize(transcript).split(" ").filter(Boolean);
    for(const token of spoken){
      if(cursor>=targets.length) break;
      let found=-1;
      for(let i=cursor;i<Math.min(cursor+5,targets.length);i+=1){ if(similar(targets[i],token)){found=i;break;} }
      if(found>=0){ for(let i=cursor;i<found;i+=1) mistakeLog.push({expected:words[i],heard:token}); errorCount+=found-cursor; cursor=found+1; }
      else { errorCount+=1; mistakeLog.push({expected:words[cursor],heard:token}); }
    }
    render();
    if(cursor>=words.length){ shouldRestart=false; els.status.textContent="Chapter completed — mashaAllah!"; recognition?.stop(); }
  }

  function makeRecognition(){
    const instance=new SpeechRecognition(); instance.lang="ar-SA"; instance.continuous=false; instance.interimResults=true; instance.maxAlternatives=1;
    instance.onstart=()=>{running=true;els.start.disabled=true;els.stop.disabled=false;els.status.textContent="Listening…";};
    instance.onresult=event=>{let preview="";for(let i=event.resultIndex;i<event.results.length;i+=1){const text=event.results[i][0].transcript;preview+=`${text} `;if(event.results[i].isFinal)consume(text);}els.heard.textContent=preview.trim()||"—";};
    instance.onerror=event=>{if(["not-allowed","service-not-allowed","audio-capture"].includes(event.error))shouldRestart=false;els.status.textContent=`Microphone error: ${event.error}. Check Chrome site permissions.`;};
    instance.onend=()=>{running=false;if(shouldRestart&&cursor<words.length){els.status.textContent="Continuing listening…";setTimeout(()=>{try{instance.start();}catch{shouldRestart=false;}},300);}else{els.start.disabled=!words.length;els.stop.disabled=true;}};
    return instance;
  }

  async function loadChapter(){
    stopRecognition(); const number=Number(els.surah.value); els.load.disabled=true; els.start.disabled=true; els.status.textContent="Loading chapter…";
    try{
      const response=await fetch(`https://api.alquran.cloud/v1/surah/${number}/quran-uthmani`); if(!response.ok)throw new Error(`HTTP ${response.status}`); const payload=await response.json();
      if(!payload.data?.ayahs?.length)throw new Error("No verses returned");
      words=payload.data.ayahs.flatMap(ayah=>ayah.text.replace(/[\u06D6-\u06ED]/g,"").split(/\s+/).filter(Boolean));
    }catch(error){
      if(number!==1){ words=[]; els.quran.textContent=""; els.status.textContent=`Could not load this chapter (${error.message}). Check your internet connection and try again.`; return; }
      words=fallbackFatiha.flatMap(ayah=>ayah.split(/\s+/)); els.status.textContent="Using the built-in Al-Fatiha copy (chapter service unavailable).";
    }finally{els.load.disabled=false;}
    targets=words.map(normalize); const [english,arabic]=chapters[number-1].split("|"); els.title.textContent=`${number}. ${english} — ${arabic}`; cursor=0;errorCount=0;mistakeLog=[];els.start.disabled=!SpeechRecognition||!words.length;render();
  }

  els.load.addEventListener("click",loadChapter);
  els.surah.addEventListener("change",loadChapter);
  els.start.addEventListener("click",()=>{if(!SpeechRecognition||!words.length)return;recognition??=makeRecognition();shouldRestart=true;try{recognition.start();}catch{els.status.textContent=running?"Already listening.":"Could not start the microphone.";}});
  els.stop.addEventListener("click",()=>{stopRecognition();els.status.textContent="Listening stopped.";});
  els.reset.addEventListener("click",resetProgress);
  if(!SpeechRecognition){els.support.textContent="Speech Recognition is unavailable. Open this page in current Chrome on Android or desktop.";els.support.classList.remove("hidden");els.start.disabled=true;}
  else if(!window.isSecureContext){els.support.textContent="The microphone requires HTTPS (or localhost). Upload this file to an HTTPS website before testing on Android.";els.support.classList.remove("hidden");}
  loadChapter();
})();
</script>
</body>
</html>
