<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Live Recitation Tracker — مُتَتَبِّع التلاوة</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  /* === THEME VARIABLES — switchable via .theme-* classes on <body> === */
  body{
    font-family:system-ui,-apple-system,sans-serif;
    padding:12px;min-height:100vh;
    transition:background-color .3s ease, color .3s ease;
  }
  /* Default = dark theme */
  body{--bg:#0a1f12;--card:rgba(255,255,255,.04);--border:rgba(46,204,113,.2);--text:#e8f5e9;--text-dim:#7a8a7a;--primary:#2ecc71;--primary-soft:rgba(46,204,113,.18);--yellow:#f1c40f;--yellow-soft:rgba(241,196,15,.15);--accent:#5dade2;--now-glow:rgba(46,204,113,.55);--shadow:rgba(0,0,0,.4);--bismillah-bg:rgba(30,132,73,.10);--bismillah-border:rgba(30,132,73,.30);--bismillah-color:#1e8449;--header-bg:transparent;--header-border:rgba(46,204,113,.25);--bismillah-header-color:#2ecc71}
  body{background:var(--bg);color:var(--text)}

  /* Light theme */
  body.theme-light{
    --bg:#fafaf5;--card:rgba(0,0,0,.03);--border:rgba(46,125,50,.2);--text:#1a3a1a;--text-dim:#6a7a6a;--primary:#2e7d32;--primary-soft:rgba(46,125,50,.12);--yellow:#b8860b;--yellow-soft:rgba(184,134,11,.10);--accent:#1565c0;--now-glow:rgba(46,125,50,.45);--shadow:rgba(0,0,0,.15);--bismillah-bg:rgba(46,125,50,.08);--bismillah-border:rgba(46,125,50,.30);--bismillah-color:#2e7d32;--header-bg:transparent;--header-border:rgba(46,125,50,.30);--bismillah-header-color:#2e7d32;
  }

  /* Sepia theme — easier on eyes, like a real mushaf */
  body.theme-sepia{
    --bg:#f4ecd8;--card:rgba(120,80,40,.06);--border:rgba(120,80,40,.25);--text:#3d2817;--text-dim:#8a6f4a;--primary:#8b4513;--primary-soft:rgba(139,69,19,.15);--yellow:#b8860b;--yellow-soft:rgba(184,134,11,.15);--accent:#a0522d;--now-glow:rgba(139,69,19,.5);--shadow:rgba(60,40,20,.25);--bismillah-bg:rgba(139,69,19,.10);--bismillah-border:rgba(139,69,19,.30);--bismillah-color:#8b4513;--header-bg:transparent;--header-border:rgba(139,69,19,.25);--bismillah-header-color:#8b4513;
  }

  /* Royal blue — premium / Quran.com inspired */
  body.theme-royal{
    --bg:#0d1b2a;--card:rgba(255,255,255,.05);--border:rgba(202,165,84,.25);--text:#f0e6d2;--text-dim:#8a9aae;--primary:#caa554;--primary-soft:rgba(202,165,84,.15);--yellow:#e0a92e;--yellow-soft:rgba(224,169,46,.15);--accent:#5dade2;--now-glow:rgba(202,165,84,.5);--shadow:rgba(0,0,0,.5);--bismillah-bg:rgba(202,165,84,.10);--bismillah-border:rgba(202,165,84,.30);--bismillah-color:#caa554;--header-bg:transparent;--header-border:rgba(202,165,84,.25);--bismillah-header-color:#caa554;
  }

  /* === HEADER (bismillah image + title) === */
  .app-header{
    max-width:700px;margin:0 auto 14px;text-align:center;
  }
  .app-header .bismillah-img{
    display:block;max-width:340px;height:auto;margin:0 auto 8px;
    /* In light/sepia themes the dark green bismillah looks too dark; invert
       it via CSS filter to make it visible. */
    filter:brightness(.9) contrast(1.1);
  }
  body.theme-light .app-header .bismillah-img,
  body.theme-sepia .app-header .bismillah-img{
    /* In light backgrounds, dark green is fine — keep it readable */
    filter:none;opacity:.85;
  }
  .app-header .app-title{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:18px;font-weight:700;letter-spacing:.3px;
    color:var(--primary);
    margin-top:6px;
  }
  .app-header .app-title .arabic{
    font-family:Amiri,serif;
    font-size:22px;font-weight:600;
    color:var(--primary);
    margin-left:8px;direction:rtl;display:inline-block;
  }
  .app-header .app-sub{
    font-size:12px;color:var(--text-dim);
    margin-top:4px;
  }

  /* === SURAH PICKER SECTION === */
  .surah-picker{
    max-width:900px;margin:0 auto 16px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px 18px 22px;
  }
  .picker-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;flex-wrap:wrap;gap:10px;
  }
  .picker-title{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:13px;font-weight:700;
    color:var(--text-dim);
    text-transform:uppercase;letter-spacing:1.5px;
    margin:0;
  }
  /* Contact Support button — green */
  .contact-support{
    display:inline-flex;align-items:center;gap:6px;
    background:linear-gradient(135deg,var(--primary),var(--primary));
    color:#fff;font-weight:700;font-size:14px;
    padding:10px 20px;border-radius:30px;
    text-decoration:none;
    box-shadow:0 2px 8px var(--now-glow);
    transition:all .15s ease;
  }
  .contact-support:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--now-glow)}
  body.theme-light .contact-support{color:#fff}
  body.theme-sepia .contact-support{color:#fff}
  /* Search row */
  .search-row{
    display:flex;gap:10px;margin-bottom:16px;
  }
  #searchInput{
    flex:1;
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 14px;
    font-family:inherit;font-size:15px;
    outline:none;
    transition:border-color .15s ease;
  }
  #searchInput::placeholder{color:var(--text-dim)}
  #searchInput:focus{border-color:var(--primary)}
  .reset-btn{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
    padding:10px 18px;
    border-radius:10px;
    font-family:inherit;font-size:14px;font-weight:600;
    cursor:pointer;
    transition:all .15s ease;
  }
  .reset-btn:hover{border-color:var(--primary);color:var(--primary)}
  /* Surah grid — fixed height with internal scroll, matches index.html */
  .surah-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:8px;
    max-height:250px;
    overflow-y:auto;
    padding:4px;
    scrollbar-width:thin;
    scrollbar-color:var(--primary) transparent;
  }
  .surah-grid::-webkit-scrollbar{width:6px}
  .surah-grid::-webkit-scrollbar-track{background:transparent}
  .surah-grid::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}
  .surah-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    cursor:pointer;
    transition:all .15s ease;
    text-align:left;
    font-family:inherit;
    color:var(--text);
    user-select:none;
  }
  .surah-card:hover{
    border-color:var(--primary);
    background:var(--primary-soft);
    transform:translateY(-1px);
  }
  .surah-card.active{
    border-color:var(--primary);
    background:var(--primary-soft);
    box-shadow:0 0 0 1px var(--primary) inset;
  }
  .surah-card.hidden{display:none}
  .surah-card .num{
    font-size:11px;font-weight:600;
    color:var(--text-dim);
    letter-spacing:.5px;
  }
  .surah-card .ar-name{
    font-family:Amiri,serif;
    font-size:18px;
    color:var(--text);
    margin-top:2px;
    line-height:1.2;
    direction:rtl;
  }
  .surah-card.active .ar-name{color:var(--primary)}
  .surah-card .translit{
    font-size:11px;
    color:var(--text-dim);
    margin-top:1px;
  }
  .surah-card .ayahs{
    font-size:10px;
    color:var(--text-dim);
    margin-top:1px;
  }

  /* === VERSION BADGE (top right) === */
  .ver{
    position:fixed;top:8px;right:8px;
    background:var(--card);color:var(--primary);
    border:1px solid var(--primary);
    padding:2px 6px;border-radius:4px;
    font-size:11px;font-family:monospace;z-index:10;
  }

  /* === SETTINGS ICON (top left) === */
  .settings-btn{
    position:fixed;top:8px;left:8px;
    background:var(--card);color:var(--primary);
    border:1px solid var(--primary);
    padding:4px 8px;border-radius:6px;
    font-size:16px;cursor:pointer;z-index:11;
    line-height:1;
  }
  .settings-btn:hover{background:var(--primary);color:var(--bg)}
  /* Settings dropdown */
  .settings-menu{
    position:fixed;top:44px;left:8px;
    background:var(--bg);border:1px solid var(--primary);
    border-radius:8px;padding:8px;z-index:11;
    min-width:180px;
    box-shadow:0 4px 12px var(--shadow);
    display:none;
  }
  .settings-menu.open{display:block}
  .settings-menu h3{
    font-size:11px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:1px;
    margin:0 0 6px 4px;
  }
  .theme-option{
    display:flex;align-items:center;gap:8px;
    padding:6px 8px;border-radius:4px;cursor:pointer;
    font-size:13px;color:var(--text);
  }
  .theme-option:hover{background:var(--primary-soft)}
  .theme-option.active{background:var(--primary-soft);font-weight:600}
  .theme-option .swatch{
    display:inline-block;width:14px;height:14px;border-radius:50%;
    border:1px solid var(--text-dim);
  }

  h1{font-size:16px;color:#2ecc71;margin-bottom:6px;text-align:center}
  .sub{font-size:11px;color:var(--text-dim);text-align:center;margin-bottom:12px}

  /* The PAGE — fixed height showing ~12-15 lines of words */
  #page{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin:0 auto 16px;
    max-width:700px;
    /* Height = ~11 lines. font-size:22px, line-height:2.1 = 46.2px/line.
       11 lines = ~510px. */
    min-height:510px;
    overflow:hidden;
    position:relative;
  }
  /* Words flow inline. LTR so DOM order = visual order */
  /* Flexbox with row-reverse guarantees DOM order = visual reading order
     for the user, regardless of the Arabic text's inherent RTL direction.
     The first item in DOM appears at the RIGHT (read first in RTL),
     subsequent items flow LEFT. The text within each word is still RTL
     (the letters within the word go right-to-left), but the words
     themselves are placed in DOM order. */
  #page-inner{
    display:flex;
    flex-direction:row-reverse;
    flex-wrap:wrap;
    align-items:baseline;
    font-family:Amiri,serif;
    font-size:22px;
    line-height:2.1;
  }
  .word{
    display:inline-flex;
    align-items:center;
    padding:2px 5px;
    border-radius:5px;
    margin:1px 2px;
    transition:all .15s;
  }
  .verse-marker{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    color:#2ecc71;
    background:rgba(46,204,113,.15);
    border:1px solid rgba(46,204,113,.3);
    border-radius:50%;
    width:26px;height:26px;
    font-size:11px;
    font-weight:700;
    margin:0 4px;
    font-family:system-ui,sans-serif;
  }
  /* Surah header takes a full row on its own */
  .surah-header{
    display:block;
    flex-basis:100%;
    color:#2ecc71;
    font-family:system-ui,sans-serif;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin:14px 0 4px;
    padding-bottom:2px;
    border-bottom:1px solid rgba(46,204,113,.2);
    text-align:right;  /* Surah header is metadata, right-align it */
  }
  .surah-header.first{margin-top:0}
  .word{display:inline-block;padding:2px 5px;border-radius:5px;margin:0 1px;transition:all .15s}
  .word.future{color:var(--text-dim);opacity:.75}
  .word.now{background:var(--primary);color:var(--bg);font-weight:700;transform:scale(1.08);box-shadow:0 0 14px var(--now-glow);position:relative;z-index:2}
  .word.past{color:var(--primary);opacity:.9}
  .word.wrong{color:#e74c3c;background:rgba(231,76,60,.18);text-decoration:line-through}
  .word.unclear{color:var(--yellow);background:var(--yellow-soft)}

  /* Bismillah word — highlighted as a soft yellow pre-chapter marker */
  /* Bismillah words: darker green (matches the surah script's green
     family but visually distinct from the standard past/future words). */
  .word.bismillah{color:#1e8449;font-weight:600}
  .word.bismillah.now{background:#1e8449;color:#0a1f12}

  /* Inline verse marker */
  .verse-marker{
    display:inline-block;
    color:#2ecc71;
    background:rgba(46,204,113,.15);
    border:1px solid rgba(46,204,113,.3);
    border-radius:50%;
    width:24px;height:24px;
    line-height:22px;
    text-align:center;
    font-size:11px;
    font-weight:700;
    margin:0 6px 0 4px;
    vertical-align:middle;
    font-family:system-ui,sans-serif;
  }
  /* Surah header — big centered block with Arabic calligraphy on left,
     English name + number on right, translation below. Matches the
     standard mushaf layout the user showed. */
  .surah-header{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-basis:100%;
    gap:24px;
    margin:20px 0 8px;
    padding:12px 0;
    border-top:1px solid rgba(46,204,113,.25);
    border-bottom:1px solid rgba(46,204,113,.25);
    text-align:center;
  }
  .surah-header.first{margin-top:0;border-top:none}
  .surah-ar{
    font-family:Amiri,serif;
    font-size:38px;
    color:var(--primary);
    line-height:1;
    direction:rtl;
  }
  .surah-info{
    text-align:left;
    font-family:system-ui,sans-serif;
    line-height:1.3;
  }
  .surah-info .num-name{
    font-size:20px;
    font-weight:700;
    color:var(--text);
  }
  .surah-info .num-name .num{color:var(--primary);margin-right:4px}
  .surah-info .meaning{
    font-size:13px;
    color:var(--primary);
    font-weight:500;
    margin-top:2px;
  }
  /* Bismillah block — just the Arabic text, no English label. Uses a
     different (more decorative) Arabic font. Color is a DARKER GREEN
     so it matches the surah script's green family but stands out as
     a header element. */
  .bismillah-block{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-basis:100%;
    margin:8px 0 16px;
    padding:12px 14px;
    background:var(--bismillah-bg);
    border:1px solid var(--bismillah-border);
    border-radius:8px;
    direction:rtl;
  }
  .bismillah-block .words{
    display:inline-flex;
    gap:2px;
  }
  /* Different (more decorative) Arabic font for the Bismillah, in a
     darker green to match the surah script's green family. */
  .bismillah-block .word{
    font-family:'Amiri Quran','Scheherazade New','Noto Naskh Arabic',Amiri,serif;
    color:var(--bismillah-color);
    font-weight:600;
  }

  /* Controls */
  .controls{
    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:700px;margin:0 auto 12px;
  }
  button{
    font-family:inherit;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--primary);background:transparent;color:var(--primary);cursor:pointer;font-weight:600;
  }
  button:hover{background:var(--primary);color:var(--bg)}
  button.primary{background:var(--primary);color:var(--bg)}
  button:disabled{opacity:.4;cursor:not-allowed}

  /* Stats */
  .stats{
    max-width:700px;margin:0 auto;font-family:monospace;font-size:11px;color:#2ecc71;text-align:center;
    background:rgba(0,0,0,.3);padding:8px;border-radius:6px;
  }
  .stats span{color:#f1c40f}
  .info{
    max-width:700px;margin:0 auto 12px;background:rgba(0,0,0,.2);border:1px solid rgba(46,204,113,.15);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.6
  }
  .info b{color:#2ecc71}
  .info code{background:rgba(46,204,113,.15);padding:1px 5px;border-radius:3px;font-size:11px}
</style>
</head>
<body class="theme-dark">

<div class="ver" id="ver">v2.2</div>

<button class="settings-btn" id="settingsBtn" title="Settings">⚙</button>
<div class="settings-menu" id="settingsMenu">
  <h3>Theme</h3>
  <div class="theme-option" data-theme="dark"><span class="swatch" style="background:#0a1f12"></span>Dark Green</div>
  <div class="theme-option" data-theme="light"><span class="swatch" style="background:#fafaf5"></span>Light</div>
  <div class="theme-option" data-theme="sepia"><span class="swatch" style="background:#f4ecd8"></span>Sepia (Mushaf)</div>
  <div class="theme-option" data-theme="royal"><span class="swatch" style="background:#0d1b2a"></span>Royal Blue</div>
</div>

<header class="app-header">
  <img class="bismillah-img" src="assets/bismillah.png" alt="Bismillah">
  <div class="app-title">Live Recitation Tracker <span class="arabic">مُتَتَبِّع التَّلَاوَة</span></div>
  <div class="app-sub">Recite the Quran and watch each word light up as you speak</div>
</header>

<section class="surah-picker">
  <div class="picker-header">
    <h2 class="picker-title">① Choose a surah</h2>
    <a href="https://docs.google.com/forms/d/e/1FAIpQLScSSIYxlRbuN6gofwRA2J69Ucueqnl14LVZIv0vjnpIvtHXUA/viewform" target="_blank" rel="noopener" class="contact-support">💬 Contact Support</a>
  </div>
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Search by number, transliteration, or Arabic name…" autocomplete="off">
    <button class="reset-btn" id="resetBtn" type="button">Reset</button>
  </div>
  <div class="surah-grid" id="surahGrid"></div>
</section>

<div style="max-width:700px;margin:0 auto 12px;display:flex;justify-content:space-between;gap:8px">
  <button id="prevPageBtn" style="flex:1;background:var(--card);color:var(--primary);border:1px solid var(--primary);padding:10px 16px;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">← Previous page</button>
  <button id="nextPageBtn" style="flex:1;background:var(--card);color:var(--primary);border:1px solid var(--primary);padding:10px 16px;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer">Next page →</button>
</div>
<div id="pageInfo" style="max-width:700px;margin:0 auto 12px;text-align:center;font-size:12px;color:var(--text-dim)">Page 1 of 1</div>

<div id="page"><div id="page-inner"></div></div>


<script src="phonemes-data.js"></script>
<script>
(function(){
  // ====== Surah metadata (Arabic name, English transliteration, meaning) ======
  const SURAH_META = [

  const SURAH_BY_NUM = {};
  for(const s of SURAH_META) SURAH_BY_NUM[s.num] = s;

  // ====== Same data build as global-words.html ======
  function normalize(s){
    return (s||'')
      .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
      .replace(/[إأآاٱ]/g, 'ا')
      .replace(/ى/g, 'ي')
      .replace(/ة/g, 'ه')
      .replace(/[^\u0600-\u06FF\s]/g, '')
      .trim();
  }
  const BISMILLAH = [
    {text:'بِسْمِ',  norm:'بسم',   phoneme:'bismi',  surah:0, ayah:'bismillah', position:1},
    {text:'ٱللَّهِ', norm:'الله',   phoneme:'lla:hi', surah:0, ayah:'bismillah', position:2},
    {text:'ٱلرَّحْمَـٰنِ', norm:'الرحن', surah:'',   surah:0, ayah:'bismillah', position:3},
    {text:'ٱلرَّحِيمِ', norm:'الرحيم', phoneme:'',    surah:0, ayah:'bismillah', position:4}
  ];
  function buildGlobalRefWords(){
    const all = [];
    for(let s = 1; s <= 114; s++){
      if(s !== 1 && s !== 9){
        for(const w of BISMILLAH){
          all.push({...w, globalIndex:all.length, surah:s});
        }
      }
      const surah = window.SURAH_PHONEMES[String(s)];
      if(!surah) continue;
      const ayahKeys = Object.keys(surah).map(Number).sort((a,b)=>a-b);
      for(const a of ayahKeys){
        const ayah = surah[String(a)];
        const posKeys = Object.keys(ayah).map(Number).sort((a,b)=>a-b);
        for(const p of posKeys){
          const [text, phoneme, rules] = ayah[String(p)];
          all.push({text, norm:normalize(text), phoneme, rules, surah:s, ayah:a, position:p, globalIndex:all.length});
        }
      }
    }
    return all;
  }
  const refWords = buildGlobalRefWords();
  let pointer = 0;

  // ====== Pagination state ======
  // The "page" shows words in [pageStart, pageEnd). When pointer is near
  // pageEnd, we extend pageEnd. When pointer is more than PAGE_KEEP_BEHIND
  // past pageStart, we move pageStart forward.
  const PAGE_SIZE = 100;         // words to show in the visible page (~18-20 lines)
  const PAGE_KEEP_BEHIND = 30;   // keep this many words behind the pointer
  const PAGE_KEEP_AHEAD = 70;    // and this many ahead
  let pageStart = 0;
  let pageEnd = Math.min(PAGE_SIZE, refWords.length);

  // ====== Render ======
  function emitSurahHeader(surahNum, isFirst){
    const meta = SURAH_BY_NUM[surahNum];
    if(!meta) return;
    const h = document.createElement('div');
    h.className = 'surah-header' + (isFirst ? ' first' : '');
    const ar = document.createElement('div');
    ar.className = 'surah-ar';
    ar.textContent = meta.name;
    h.appendChild(ar);
    const info = document.createElement('div');
    info.className = 'surah-info';
    info.innerHTML = '<div class="num-name"><span class="num">' + meta.num + '.</span>Surah ' + meta.translit + '</div><div class="meaning">' + meta.meaning + '</div>';
    h.appendChild(info);
    document.getElementById('page-inner').appendChild(h);
  }
  function emitBismillahBlock(startIdx, endIdx){
    // The user wants Bismillah shown ABOVE the surah content as a
    // separate recitable block. It is still part of the global
    // refWords (so the matcher highlights it as the user recites),
    // but visually it's in its own yellow-tinted block — just the
    // Arabic text, no English label. Uses a more decorative Arabic
    // font (Amiri Quran / Scheherazade / Noto Naskh) but keeps
    // the same yellow color.
    const block = document.createElement('div');
    block.className = 'bismillah-block';
    const words = document.createElement('span');
    words.className = 'words';
    for(let i = startIdx; i < endIdx; i++){
      const w = refWords[i];
      const span = document.createElement('span');
      span.className = 'word bismillah';
      if(i < pointer) span.classList.add('past');
      else if(i === pointer) span.classList.add('now');
      else span.classList.add('future');
      span.textContent = w.text;
      words.appendChild(span);
    }
    block.appendChild(words);
    document.getElementById('page-inner').appendChild(block);
  }
  function renderPage(){
    const inner = document.getElementById('page-inner');
    inner.innerHTML = '';
    // Walk words in [pageStart, pageEnd). Group:
    //   - surah headers: when surah changes
    //   - bismillah blocks: when the first 4 words of a surah (except 1 and 9) are Bismillah
    //   - verse markers: AFTER the last word of each ayah (not before the first)
    let lastSurah = null;
    let ayahEndIdx = -1;  // index of the last word of the current ayah
    let ayahNum = null;
    let isFirstSurah = true;
    // Pre-compute which words are Bismillah runs at the start of each surah
    function isBismillahRun(s, e){
      if(e - s !== 4) return false;
      for(let i = s; i < e; i++){
        if(refWords[i].ayah !== 'bismillah') return false;
      }
      return true;
    }
    for(let i = pageStart; i < pageEnd; i++){
      const w = refWords[i];
      // === Surah transition ===
      if(w.surah !== lastSurah){
        // Close out the previous ayah's marker (if any)
        if(ayahNum !== null && lastSurah !== null){
          // (handled at ayah-end below)
        }
        ayahNum = null;
        // Check if the next 4 words are Bismillah (for surahs 2-114)
        // If yes, emit surah header first, THEN bismillah block
        if(isBismillahRun(i, Math.min(i+4, refWords.length))){
          emitSurahHeader(w.surah, isFirstSurah);
          isFirstSurah = false;
          emitBismillahBlock(i, i+4);
          lastSurah = w.surah;
          // Skip the 4 Bismillah words in the regular word loop — they're
          // already rendered inside the bismillah block.
          // We need to advance the verse-marker for the Bismillah "ayah"
          // AFTER the bismillah block, so the next word in DOM is the
          // marker for the Bismillah.
          // The bismillah ayah is "ayah 1" of the surah, so marker is "1".
          // Per the user's request, the Bismillah's marker should appear
          // AFTER the Bismillah words (i.e. just before ayah 2).
          // We'll emit it after the bismillah block, before the next word.
          const m = document.createElement('span');
          m.className = 'verse-marker';
          m.textContent = '1';
          document.getElementById('page-inner').appendChild(m);
          // Now skip past the 4 Bismillah words
          i += 3;  // (i++ in the loop will move to i+4)
          continue;
        }
        // For surah 1 (Al-Fatihah): the first 4 words ARE its ayah 1
        // (Bismillah). Don't emit a bismillah block. Just emit the surah
        // header and let the word loop render the Bismillah as the first
        // 4 words of ayah 1.
        emitSurahHeader(w.surah, isFirstSurah);
        isFirstSurah = false;
        lastSurah = w.surah;
      }
      // === Detect end of current ayah (for verse marker) ===
      // We emit the verse marker AFTER the last word of an ayah, not
      // before. So we need to peek ahead: if the next word is in a
      // different ayah (or there is no next word), this word is the
      // last word of the current ayah.
      const isLastWordOfAyah = (i === pageEnd - 1) ||
        (refWords[i+1].ayah !== w.ayah) ||
        (refWords[i+1].surah !== w.surah);
      // === Emit the word ===
      const span = document.createElement('span');
      span.className = 'word';
      // Bismillah words: rendered inside the bismillah block, so they
      // shouldn't reach here for surahs 2-114. But Al-Fatihah's
      // ayah 1 IS Bismillah and is NOT in a bismillah block — it
      // gets the regular bismillah color.
      if(w.ayah === 'bismillah' && w.surah === 1) span.classList.add('bismillah');
      if(i < pointer) span.classList.add('past');
      else if(i === pointer) span.classList.add('now');
      else span.classList.add('future');
      span.textContent = w.text;
      inner.appendChild(span);
      // === If this is the last word of the ayah, emit the verse marker ===
      if(isLastWordOfAyah && w.ayah !== 'bismillah'){
        const m = document.createElement('span');
        m.className = 'verse-marker';
        m.textContent = w.ayah;
        inner.appendChild(m);
      }
    }
    // Update the page info display
    updateStats();
  }

  function updateStats(){
    // Compute the current page number and total pages
    const currentPageNum = Math.floor(pageStart / PAGE_SIZE) + 1;
    const totalPages = Math.max(1, Math.ceil(refWords.length / PAGE_SIZE));
    const el = document.getElementById('pageInfo');
    if(el) el.textContent = 'Page ' + currentPageNum + ' of ' + totalPages;
  }

  function maybePaginate(){
    // If pointer is within PAGE_KEEP_AHEAD of pageEnd, extend the page
    if(pointer >= pageEnd - PAGE_KEEP_AHEAD){
      pageEnd = Math.min(pointer + PAGE_KEEP_AHEAD, refWords.length);
    }
    // If pointer is more than PAGE_KEEP_BEHIND past pageStart, advance pageStart
    if(pointer > pageStart + PAGE_KEEP_BEHIND){
      pageStart = pointer - PAGE_KEEP_BEHIND;
    }
  }

  // ====== Controls ======
  function advance(n){
    pointer = Math.min(pointer + n, refWords.length - 1);
    maybePaginate();
    renderPage();
  }
  function goTo(idx){
    pointer = Math.max(0, Math.min(idx, refWords.length - 1));
    // Center the page around the pointer
    pageStart = Math.max(0, pointer - 10);
    pageEnd = Math.min(refWords.length, pageStart + PAGE_SIZE);
    renderPage();
  }
  function prevPage(){
    pageStart = Math.max(0, pageStart - PAGE_SIZE);
    pageEnd = Math.min(refWords.length, pageStart + PAGE_SIZE);
    renderPage();
  }
  function nextPage(){
    pageEnd = Math.min(refWords.length, pageEnd + PAGE_SIZE);
    pageStart = Math.max(0, pageEnd - PAGE_SIZE);
    renderPage();
  }
  function reset(){
    pointer = 0;
    pageStart = 0;
    pageEnd = Math.min(PAGE_SIZE, refWords.length);
    renderPage();
  }

  document.getElementById('prevPageBtn').addEventListener('click', prevPage);
  document.getElementById('nextPageBtn').addEventListener('click', nextPage);

  // === THEME SWITCHER ===
  const settingsBtn = document.getElementById('settingsBtn');

  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsMenu.classList.toggle('open');

  function setTheme(themeName){
    document.body.classList.remove('theme-dark','theme-light','theme-sepia','theme-royal');

      setTheme(o.dataset.theme);
      settingsMenu.classList.remove('open');

  let _savedTheme = null;
  try{ _savedTheme = localStorage.getItem('hifzapp-theme'); }catch(e){}
  if(_savedTheme && ['dark','light','sepia','royal'].includes(_savedTheme)){
    setTheme(_savedTheme);

    const _prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    setTheme(_prefersLight ? 'light' : 'dark');
  }

  // ==== SURAH PICKER ====
  function renderSurahGrid(){
    const grid = document.getElementById('surahGrid');
    if(!grid) return;
    grid.innerHTML = '';
    for(const s of SURAH_META){
      const card = document.createElement('div');
      card.className = 'surah-card';
      card.dataset.num = s.num;
      card.innerHTML = '<div class="num">Surah ' + s.num + '</div>' +
                       '<div class="ar-name">' + s.name + '</div>' +
                       '<div class="translit">' + s.translit + ' &middot; ' + s.meaning + '</div>' +
                       '<div class="ayahs">' + s.verses + ' ayah' + (s.verses === 1 ? '' : 's') + '</div>';
      card.addEventListener('click', () => selectSurah(s.num, card));
      grid.appendChild(card);
    }
  }
  function selectSurah(num, cardEl){
    if(!window.SURAH_PHONEMES){ return; }
    // Mark active card
    document.querySelectorAll('.surah-card').forEach(c => c.classList.toggle('active', c === cardEl));
    // Find the surah in refWords
    const startIdx = refWords.findIndex(w => w.surah === num);
    if(startIdx < 0) return;
    // End of this surah: start of next surah
    let endIdx = refWords.length;
    for(let i = startIdx + 1; i < refWords.length; i++){
      if(refWords[i].surah !== num){
        endIdx = i;
        break;
      }
    }
    // CONTINUOUS FLOW: keep the current pageStart, but extend pageEnd to
    // include the new surah. The new surah header will appear at the
    // position of the new surah's first word (which is now at the
    // bottom of the page, where the new content starts) — NOT at the top.
    // If the new surah starts before the current pageStart (user picked
    // an earlier surah), just navigate to the start of the picked surah.
    if(startIdx < pageStart){
      pageStart = startIdx;
    }
    pointer = startIdx;
    // Extend pageEnd to include the new surah's content (so the user can
    // see at least the start of the new surah in the rendered page)
    pageEnd = Math.max(pageEnd, Math.min(endIdx, startIdx + PAGE_SIZE));
    renderPage();
  }

  if(searchInput){
    searchInput.addEventListener('input', (e) => {

    resetBtn.addEventListener('click', () => {
      if(searchInput) searchInput.value = '';
      document.querySelectorAll('.surah-card').forEach(c => {
        c.classList.remove('hidden');
        c.classList.remove('active');
      });
      window.scrollTo({top:0, behavior:'smooth'});
    });
  }

  // Render the surah grid
  renderSurahGrid();

  // Initial render (page starts empty — user picks a surah to begin)
  renderPage();

  // Expose for debugging
  window.__refWords = refWords;
  window.__getPointer = () => pointer;
})();
</script>
</body>
</html>
